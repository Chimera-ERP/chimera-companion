name: chimera_companion
description: "Local hardware companion for Chimera ERP and POS."
publish_to: 'none'
version: 0.1.45+47

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.0.7
  timezone: ^0.11.1
  basic_utils: ^5.8.2
  crypto: ^3.0.7
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  forui: ^0.25.0
  path_provider: ^2.1.6
  pointycastle: ^4.0.0
  # Pin the BLE family together: 5.6 requires Android SDK37; this app targets36.
  flutter_reactive_ble: 5.4.0
  permission_handler: ^12.0.1
  reactive_ble_mobile: 5.4.0
  reactive_ble_platform_interface: 5.4.0
  rive: ^0.14.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - LICENSE
    - NOTICE
    - assets/customer-display/index.html
    - assets/motion/
